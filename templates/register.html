<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Farmer Registration</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to right, #dce35b, #45b649);
            color: #2e7d32;
        }

        #particles-js {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1;
        }

        .content {
            max-width: 500px;
            margin: 120px auto;
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 30px;
            color: #388e3c;
        }

        form input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 2px solid #c8e6c9;
            border-radius: 10px;
            font-size: 1rem;
        }

        form input:focus {
            outline: none;
            border-color: #81c784;
            box-shadow: 0 0 5px #a5d6a7;
        }

        button {
            background-color: #43a047;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #388e3c;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            color: #2e7d32;
            font-weight: 600;
        }

        a:hover {
            color: #1b5e20;
        }

        @media (max-width: 600px) {
            .content {
                margin: 80px 5%;
                padding: 30px;
            }
        }
    </style>
</head>
<body>

<div id="particles-js"></div>

<div class="content">
    <h1>Register as a Farmer</h1>
    <form method="POST" action="{{ url_for('register') }}">
        <input type="text" name="name" placeholder="Full Name" required>
        <input type="text" name="village" placeholder="Village Name" required>
        <input type="text" name="phone" placeholder="Phone Number" required>
        <input type="text" name="crops" placeholder="Main Crops" required>
        <button type="submit">Register</button>
    </form>

    <a href="{{ url_for('home') }}">← Back to Home</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
<script>
    particlesJS.load('particles-js', '{{ url_for('static', filename='js/particles.json') }}');
</script>

</body>
</html>
